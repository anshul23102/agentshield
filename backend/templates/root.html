<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentShield API</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #16345f, transparent 34%),
        radial-gradient(circle at 82% 72%, #432017, transparent 30%),
        #05070c;
      color: #f5f7fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(760px, calc(100vw - 40px));
      padding: 44px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      background: rgba(18, 22, 30, 0.72);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(22px);
    }
    .badge {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      color: #71f083;
      background: rgba(57, 255, 109, 0.12);
      border: 1px solid rgba(113, 240, 131, 0.22);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 12px;
    }
    h1 {
      margin: 22px 0 12px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 0.95;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: #c7ccd8;
      font-size: 18px;
      line-height: 1.65;
      max-width: 620px;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }
    a {
      color: #f5f7fb;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-weight: 700;
    }
    a.primary {
      background: #2f7df6;
      border-color: #5d9bff;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Operational</span>
    <h1>AgentShield API</h1>
    <p>Backend service for real-time input inspection, output leak scanning, trust scoring, live events, and dashboard analytics.</p>
    <nav>
      <a class="primary" href="/status">View Status</a>
      <a href="/docs">API Docs</a>
      <a href="/api/status">JSON Status</a>
      <a href="https://agentshield-three.vercel.app">Open Platform</a>
    </nav>
  </main>
</body>
</html>
