# Proxies /api and /ws to the backend container the same way vite.config.js's
# dev-server proxy does for local development - the React app's own code
# (utils/api.js, hooks/useWebSocket.js) always talks to relative /api and /ws
# paths, so this is what makes that work identically in a container as it
# does in `npm run dev`.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback: React Router owns client-side routing, so any path not
    # matched above (e.g. a hard refresh on /dashboard) must still serve
    # index.html rather than nginx's default 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
