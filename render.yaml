services:
  - type: web
    name: agentshield-api
    runtime: python
    rootDir: backend
    # requirements.lock pins the full transitive dependency tree, not just
    # direct deps - requirements.txt alone previously let pip silently pull
    # an incompatible `websockets` and break the live dashboard in production.
    buildCommand: pip install -r requirements.lock
    startCommand: python run_server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GITHUB_TOKEN
        sync: false
      - key: AGENTSHIELD_ALLOWED_ORIGINS
        # Defaults to "*" in code if unset. CORS matters less here than on a
        # cookie-authenticated API - this API is header-based (X-API-Key),
        # which the browser never attaches automatically, so a wildcard can't
        # be used to silently ride a logged-in user's session from another
        # site. Still scoped to the real frontend origin as defense-in-depth.
        value: https://agentshield-three.vercel.app
    plan: free
    # Render's free tier has no persistent disk - local filesystem (including
    # the SQLite DB and the auto-generated admin/API key files) is wiped on
    # every redeploy or cold restart. Render only allows attaching a disk on
    # the Starter plan or higher, and /var/data does not exist as a writable
    # path until that disk is actually mounted - setting AGENTSHIELD_DB_PATH
    # to it ahead of time crashes the app on boot (mkdir/open fails) with no
    # disk present, which is exactly what broke the deploy for this commit.
    # To upgrade: bump `plan` below Starter or higher, uncomment the disk
    # block AND the AGENTSHIELD_DB_PATH env var together - never one without
    # the other.
    # disk:
    #   name: agentshield-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # envVars also needs, once the disk above is active:
    #   - key: AGENTSHIELD_DB_PATH
    #     value: /var/data/agentshield.db
